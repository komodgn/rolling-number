name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and Robolectric tests
        run: ./gradlew :android:rollingnumber:testDebugUnitTest
      - name: Build sample
        run: ./gradlew :android:sample:assembleDebug

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on latest iOS simulator
        run: |
          xcodebuild test -scheme RollingNumber \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
